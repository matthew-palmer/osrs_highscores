# Publishes the package to PyPI when a GitHub Release is published.
#
# The release tag must match osrs_highscores/__version__.py (e.g. tag `v0.10.0` or `0.10.0` for version 0.10.0).
# Uses PyPI Trusted Publishing, so no API token is needed. See README.md "Releasing" for the one-time setup.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Check release tag matches package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(python -c "exec(open('osrs_highscores/__version__.py').read()); print(__version__)")
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Release tag '$TAG' does not match package version '$VERSION' in osrs_highscores/__version__.py"
            exit 1
          fi
      - name: Build package
        run: python -m build
      - name: Check package
        run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/osrs_highscores
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
